<p>analysis-result works!</p>

@if (result) {
  <p>Key: {{ result.key }}</p>
  <p>Tempo: {{ result.tempo_bpm }} BPM</p>
<!--  <p>Duration: {{ result.duration_seconds }}s</p>-->
<!--  <p>Confidence: {{ result.key_confidence * 100 | number:'1.0-0' }}%</p>-->

  @for (chord of result.chords; track chord.time) {
    <div>
      <span>{{ chord.time | number:'1.1-1' }}s</span>
      <span>{{ chord.chord }}</span>
    </div>
  }
} @else {
  <p>Waiting for analysis...</p>
}
