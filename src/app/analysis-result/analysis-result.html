@if (result) {
  <p>Key: {{ result.key }}</p>
  <p>Tempo: {{ result.tempo_bpm }} BPM</p>

  <table class="chord-grid-table">
    <tbody>
      @for (row of chordRows; track $index) {
        <tr>
          @for (chord of row; track chord.time) {
            <td [class.highlighted-cell]="currentChord && chord.time === currentChord.time">
              <div class="chord-cell-content">
                <span class="chord-name">{{ chord.chord }}</span>
                <span class="chord-time">{{ chord.time | number:'1.1-1' }}s</span>
              </div>
            </td>
          }
        </tr>
      }
    </tbody>
  </table>

} @else {
  <p>Waiting for analysis...</p>
}
